<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>问道长生 · 修仙文字游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='24' y='8' width='16' height='6' rx='2' fill='%238a6d3b'/%3E%3Cellipse cx='32' cy='34' rx='16' ry='20' fill='%23c05f55'/%3E%3Cellipse cx='32' cy='34' rx='8' ry='14' fill='%23e8b25c'/%3E%3Crect x='24' y='52' width='16' height='5' rx='2' fill='%238a6d3b'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#FBF8F1; --paper2:#F5EFE1; --ink:#3F3A34; --ink2:#8C8578; --ink3:#2B2620;
  --gold:#C9A45C; --jade:#6FA698; --red:#C05F55; --blue:#5E8FAE; --purple:#8B6FA8; --pink:#D88FA5;
  --barbg:#E8E4DC; --hair:#E3D6B8; --line:rgba(201,164,92,.35);
  --font-kai:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC",serif;
  --font-song:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun","宋体",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--font-song);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- 背景 ---------- */
#bgArt{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(201,164,92,.14), transparent 60%),
    radial-gradient(900px 420px at 8% 108%, rgba(111,166,152,.16), transparent 62%),
    linear-gradient(#F8F3E8,#F1EBDC);
}
#bgArt .mountains{position:absolute;bottom:0;left:0;width:100%;height:34vh;min-height:180px}
.motes span{position:absolute;bottom:-30px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,164,92,.85),transparent 70%);
  animation:rise linear infinite;opacity:0;
}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.7}100%{transform:translateY(-108vh);opacity:0}}
#sceneTint{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
body[data-scene] #sceneTint{opacity:1}

/* ---------- 灯笼 ---------- */
.lantern{width:52px;height:72px;border-radius:46%/40%;position:relative;margin:6px auto 2px;
  background:radial-gradient(circle at 50% 32%, #efc27a, #d68a4e 55%, #c05f55 100%);
  box-shadow:0 0 46px 14px rgba(224,150,60,.38), inset 0 -8px 18px rgba(120,40,30,.35);
  animation:sway 4.5s ease-in-out infinite;
}
.lantern::before{content:"";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  width:2px;height:15px;background:#8a6d3b}
.lantern::after{content:"";position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);
  width:3px;height:17px;background:#8a6d3b;border-radius:2px}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.candle{width:10px;height:14px;border-radius:50%/60% 60% 40% 40%;display:inline-block;vertical-align:-2px;
  background:radial-gradient(circle at 50% 70%,#f6d365,#e8833a 70%,#c05f55);
  box-shadow:0 0 12px 3px rgba(230,150,60,.5);animation:flick 1s infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.15) rotate(2deg)}}

/* ---------- 居中页（设置/标题） ---------- */
.screen{min-height:100dvh}
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 16px;gap:10px}
.game-title{font-family:var(--font-kai);font-size:clamp(44px,9vw,80px);letter-spacing:.32em;
  margin:10px 0 0;font-weight:700;color:#4a3b28;text-shadow:0 2px 14px rgba(201,164,92,.4);
  text-indent:.32em}
.subtitle{color:var(--ink2);letter-spacing:.22em;font-size:13.5px}
.title-menu{display:flex;flex-direction:column;gap:12px;margin-top:22px;width:min(360px,92vw)}
.title-btn{font-family:var(--font-kai);font-size:18px;letter-spacing:.14em;color:#5a4a30;
  background:rgba(251,248,241,.9);border:1.5px solid var(--gold);border-radius:12px;
  padding:13px 18px;cursor:pointer;transition:all .18s;box-shadow:0 3px 12px rgba(120,90,40,.12)}
.title-btn:hover{transform:translateX(5px);box-shadow:0 6px 18px rgba(160,120,50,.22);
  border-color:#a87e2e;background:#fffdf6}
.title-btn.resume{border-color:var(--jade)}
.title-note{color:var(--ink2);font-size:12.5px;margin-top:16px;letter-spacing:.08em;text-align:center;line-height:2}
.credit{color:#b09a6c;font-size:12px;letter-spacing:.3em;margin-top:6px}

/* ---------- 表单 ---------- */
.setup-card{width:min(600px,94vw);background:var(--paper);border:1.5px solid var(--jade);
  border-radius:14px;padding:20px 22px;box-shadow:0 8px 30px rgba(90,70,30,.14);margin-top:14px}
.setup-card h2{font-family:var(--font-kai);margin:2px 0 6px;font-size:20px;letter-spacing:.1em;color:#3d5a50}
.prov-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.prov-chip{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid #cbb98d;
  background:#fffdf6;color:#6b5a3a;cursor:pointer;transition:all .15s}
.prov-chip:hover{border-color:var(--gold)}
.prov-chip.on{background:var(--jade);border-color:var(--jade);color:#fff}
.fld{margin:10px 0}
.fld label{display:block;font-size:13px;color:#7a6a48;margin-bottom:4px;letter-spacing:.06em}
.inp{width:100%;padding:9px 12px;border:1.2px solid #d8c9a3;border-radius:9px;background:#fffdf8;
  color:var(--ink);font-size:15px;font-family:inherit;outline:none;transition:border .15s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.18)}
textarea.inp{resize:vertical;line-height:1.6}
.setup-status{font-size:13px;color:#7a6a48;min-height:1.4em;margin-top:6px;word-break:break-all}
.btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.primary-btn{background:linear-gradient(135deg,#7cb3a4,#5f9486);color:#fff;border:none;
  padding:10px 22px;border-radius:10px;font-size:15px;letter-spacing:.1em;cursor:pointer;
  box-shadow:0 4px 12px rgba(95,148,134,.35);transition:all .15s;font-family:var(--font-kai)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(95,148,134,.45)}
.primary-btn:disabled{opacity:.6;cursor:default;transform:none}
.ghost-btn{background:transparent;border:1.2px solid #cbb98d;color:#6b5a3a;padding:9px 18px;
  border-radius:10px;font-size:14px;cursor:pointer;transition:all .15s}
.ghost-btn:hover{background:#f1e7cf;border-color:var(--gold)}

/* ---------- 游戏页框架 ---------- */
#gameScreen{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#topBar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  height:54px;padding:0 14px;background:rgba(251,248,241,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);z-index:30}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-logo{font-family:var(--font-kai);font-size:19px;letter-spacing:.2em;color:#4a3b28;white-space:nowrap}
.tb-badge{font-size:12px;color:#fff;background:var(--jade);padding:2px 10px;border-radius:999px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.tb-turn{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tb-right{display:flex;gap:8px;align-items:center}
.tb-btn{border:1px solid #cbb98d;background:transparent;color:#6b5a3a;font-size:12.5px;
  padding:4px 11px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tb-btn:hover{background:#f1e7cf;border-color:var(--gold)}
#gameLayout{flex:1;display:flex;min-height:0}
#storyWrap{flex:1;overflow-y:auto;scroll-behavior:smooth}
#storyArea{max-width:800px;margin:0 auto;padding:20px 16px 46px}
#sidePanel{flex:none;width:336px;overflow-y:auto;border-left:1px solid var(--line);
  background:rgba(248,243,230,.75);padding:14px}
.side-title{font-family:var(--font-kai);font-size:15px;color:#5a4a30;letter-spacing:.12em;
  margin:14px 0 8px;border-left:3px solid var(--gold);padding-left:9px}
.side-note{color:var(--ink2);font-size:12.5px;line-height:1.9;margin-top:8px}
#sideOverlay{display:none}

/* ---------- 输入区 ---------- */
#inputBar{flex:none;background:linear-gradient(rgba(251,248,241,.94),#F6F0E1);
  border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
#inputBar .inner{max-width:800px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12.5px;padding:3px 11px;border-radius:999px;border:1px solid #cbb98d;
  background:#fffdf6;color:#6b5a3a;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--gold);background:#f6edd7}
.chip.danger{border-color:#d8a49a;color:#a04b3f}
.chip:disabled{opacity:.5;cursor:default}
.input-row{display:flex;gap:10px;align-items:flex-end;margin-top:9px}
#inputBox{flex:1;resize:none;border:1.2px solid #d8c9a3;border-radius:12px;background:#fffdf8;
  padding:10px 13px;font-size:15.5px;font-family:inherit;line-height:1.6;color:var(--ink);
  outline:none;max-height:140px;transition:border .15s}
#inputBox:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.16)}
#sendBtn{flex:none;font-family:var(--font-kai);font-size:16px;letter-spacing:.14em;color:#fff;
  background:linear-gradient(135deg,#7cb3a4,#5f9486);border:none;border-radius:12px;
  padding:11px 22px;cursor:pointer;box-shadow:0 4px 12px rgba(95,148,134,.35);transition:all .15s}
#sendBtn:hover{transform:translateY(-1px)}
#sendBtn:disabled{opacity:.6;cursor:default;transform:none}

/* ---------- 回合 ---------- */
.turn{margin:12px 0 26px;padding:15px 17px;background:rgba(255,253,248,.6);
  border:1px solid rgba(201,164,92,.28);border-radius:15px;
  box-shadow:0 3px 14px rgba(110,85,40,.07);animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.turn.past{animation:none;opacity:.96}
.turn-date{font-family:var(--font-kai);color:#8a6d3b;letter-spacing:.1em;font-size:15px;
  border-left:3px solid var(--gold);padding-left:10px;margin-bottom:10px}
.scene-chip{display:inline-block;font-size:12px;color:#fff;border-radius:5px;padding:1px 9px;
  letter-spacing:.14em;margin-left:9px;vertical-align:1px;box-shadow:inset 0 -1px 2px rgba(0,0,0,.2)}
.narr{text-indent:2em;margin:9px 0;color:var(--ink)}
.dlg{margin:8px 0 8px .6em;color:var(--ink)}
.dlg b{font-family:var(--font-kai);color:#7a5a34;letter-spacing:.06em;margin-right:6px}
.roll{font-size:13.5px;color:#8a6d3b;margin:7px 0;font-family:var(--font-kai)}

/* ---------- 面板 ---------- */
.xpanel{background:var(--paper);border:1.5px solid var(--pc,#8C8578);border-radius:11px;
  padding:13px 15px;margin:11px 0;box-shadow:0 3px 12px rgba(80,60,25,.09);position:relative}
.xpanel::before{content:"";position:absolute;inset:5px;border:1px solid #d8c9a3;border-radius:7px;
  pointer-events:none;opacity:.45;border-color:color-mix(in srgb,var(--pc,#8C8578) 32%,transparent)}
.xp-title{display:inline-block;background:var(--pc,#8C8578);color:#fff;font-weight:700;
  font-family:var(--font-kai);padding:3px 15px;border-radius:7px;letter-spacing:.14em;
  margin-bottom:8px;font-size:15px;box-shadow:0 2px 6px color-mix(in srgb,var(--pc,#8C8578) 35%,transparent)}
.xp-row{margin:6px 0;line-height:1.8;color:var(--ink)}
.xp-row.strong,.xp-row.strong *{font-weight:700;color:var(--ink3)}
.xp-row.alert{color:#a03b2f}
.xp-note{color:var(--ink2);font-size:13px;line-height:1.8;margin:5px 0}
.xp-sep{border:none;border-top:1px dashed var(--gold);opacity:.55;margin:10px 0}
.kvrow{display:flex;gap:10px;margin:6px 0;align-items:baseline}
.kvrow.wrap{flex-wrap:wrap}
.kv-k{flex:none;font-size:13px;color:var(--ink2);letter-spacing:.08em;min-width:3.2em}
.kv-v{color:var(--ink);font-size:14.5px}
.els{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.elchip{display:inline-block;min-width:1.75em;text-align:center;color:#fff;border-radius:5px;
  padding:1px 6px;font-size:13px;letter-spacing:.05em;box-shadow:inset 0 -1px 2px rgba(0,0,0,.18)}
.bar{display:flex;align-items:center;gap:9px;margin:7px 0}
.bar-label{flex:none;width:5.2em;font-size:13.5px;color:var(--ink2);letter-spacing:.05em}
.bar-track{flex:1;height:10px;background:var(--barbg);border-radius:5px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar-fill{display:block;height:100%;border-radius:5px;transition:width .6s ease;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.15)}
.bar-val{flex:none;min-width:5em;text-align:right;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.favwrap{display:flex;flex-wrap:wrap;gap:6px}
.fav{font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--fc,#8C8578);
  color:var(--fc,#8C8578);background:color-mix(in srgb,var(--fc,#8C8578) 8%,transparent);white-space:nowrap}
.statuscard{font-size:15px}
.ledger{max-height:44vh;overflow-y:auto;padding-right:4px}
.sk-cat{font-size:12px;color:#8a6d3b;letter-spacing:.14em;margin:9px 0 3px;
  border-bottom:1px dashed var(--hair);font-family:var(--font-kai)}
.skill-item{border-left:3px solid var(--skc,#8C8578);padding:2px 0 2px 8px;margin:6px 0}
.skill-name{font-family:var(--font-kai);font-weight:700;font-size:14px;color:var(--ink3)}
.skill-desc{font-size:12.5px;color:var(--ink2);line-height:1.65}
.npc-item{padding:3px 0 3px 8px;margin:6px 0;border-left:3px solid #7FA8C9}
.npc-realm{display:inline-block;font-size:11.5px;color:#fff;background:#7FA8C9;
  border-radius:4px;padding:0 6px;margin-left:7px;vertical-align:1px}

/* ---------- 选项 ---------- */
.opts{margin:12px 0 4px}
.opt-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:15px;
  background:var(--paper);border:1.5px solid #cbb98d;border-radius:11px;padding:10px 13px;
  margin:8px 0;cursor:pointer;color:var(--ink3);transition:all .16s;line-height:1.55}
.opt-btn:hover:not(:disabled){transform:translateX(5px);background:#fffdf6;
  box-shadow:0 4px 14px rgba(150,115,50,.16);border-color:var(--gold)}
.opt-btn:disabled{cursor:default;opacity:.55}
.opt-btn.chosen{opacity:1;border-width:2px;background:#f4ead0;box-shadow:0 3px 10px rgba(160,120,50,.18)}
.opt-letter{flex:none;width:27px;height:27px;border-radius:50%;border:1.5px solid var(--lc,#6FA698);
  color:var(--lc,#6FA698);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt-btn.chosen .opt-letter{background:var(--lc,#6FA698);color:#fff}
.opt-tag{flex:none;font-size:12px;color:#fff;padding:1px 9px;border-radius:5px;letter-spacing:.1em}
.opt-text{flex:1}
.freehint{text-align:center;color:var(--ink2);font-size:12.5px;margin-top:10px;letter-spacing:.1em}

/* ---------- 玩家消息 / 流式 ---------- */
.msg-wrap.user{display:flex;justify-content:flex-end;margin:16px 0 8px}
.msg-user{max-width:86%;background:linear-gradient(#f4ecd9,#ecdfc4);border:1px solid #d8c9a3;
  border-radius:13px 13px 3px 13px;padding:10px 15px;color:#4a3f2c;white-space:pre-wrap;
  box-shadow:0 2px 8px rgba(140,110,60,.12)}
.turn.streaming{border-style:dashed;opacity:.92}
.stream-head{font-family:var(--font-kai);color:#8a6d3b;letter-spacing:.14em;font-size:14.5px;
  display:flex;align-items:center;gap:9px;margin-bottom:6px}
.stream-pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13.5px;
  color:#6f665a;max-height:230px;overflow:auto;margin:0;line-height:1.7}
.turn.err{border-color:#d8a49a}

/* ---------- 弹窗 ---------- */
#modalRoot{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;
  padding:18px}
#modalRoot.show{display:flex}
.modal-overlay{position:absolute;inset:0;background:rgba(42,34,20,.45);backdrop-filter:blur(3px)}
.modal-card{position:relative;width:min(740px,96vw);max-height:84dvh;overflow-y:auto;
  background:var(--paper);border:1.5px solid var(--gold);border-radius:15px;padding:20px 22px;
  box-shadow:0 20px 60px rgba(50,38,15,.35);animation:fadeUp .25s ease}
.modal-title{font-family:var(--font-kai);font-size:19px;color:#4a3b28;letter-spacing:.14em;
  border-left:4px solid var(--gold);padding-left:11px;margin-bottom:12px}
.modal-close{position:sticky;top:0;float:right;margin-top:-4px}
.help-sec{margin:12px 0}
.help-sec b{font-family:var(--font-kai);color:#5a4a30;letter-spacing:.1em}
.help-sec p,.help-sec li{font-size:14px;color:var(--ink);line-height:1.9;margin:5px 0}
.save-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 4px;border-bottom:1px dashed var(--hair)}
.save-row:last-of-type{border-bottom:none}
.save-ops{display:flex;gap:6px;flex:none}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(16px);
  background:rgba(52,42,26,.92);color:#f5ecd7;padding:9px 20px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:120;letter-spacing:.05em;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 独立战斗界面与特效 ---------- */
#battleUI{display:none;position:fixed;left:0;right:0;top:54px;bottom:0;z-index:46;
  overflow-y:auto;background:linear-gradient(rgba(251,248,241,.97),#F6EFDF 30%,#F1E7D2);
  border-top:3px solid #C4675C;box-shadow:0 -10px 40px rgba(120,60,40,.25);padding:14px 14px 24px}
#battleUI.show{display:block;animation:btIn .3s ease}
@keyframes btIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#battleUI.shake{animation:shakeX .45s ease}
@keyframes shakeX{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.bt-head{display:flex;align-items:center;justify-content:space-between;max-width:800px;margin:0 auto 10px}
.bt-vs{font-family:var(--font-kai);font-size:20px;letter-spacing:.2em;color:#8a4a3a;font-weight:700}
.bt-vs b{color:#C9A45C}
.bt-bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:800px;margin:0 auto 8px}
.bt-side{background:var(--paper);border:1.5px solid #C4675C;border-radius:11px;padding:10px 12px;position:relative;
  box-shadow:0 3px 12px rgba(120,60,40,.12)}
.bt-name{font-family:var(--font-kai);font-weight:700;font-size:15px;color:#4a3b28;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-side.me{border-color:#6FA698}
.bar.big .bar-track{height:15px}
.bar.big .bar-label{font-weight:700}
#btStage{max-width:800px;margin:0 auto}
.bt-foot{text-align:center;color:#8C8578;font-size:12.5px;margin-top:10px;letter-spacing:.1em}
.dmgfloat{position:absolute;right:12px;top:2px;font-family:var(--font-kai);font-weight:700;font-size:26px;
  animation:dfloat 1.3s ease-out forwards;pointer-events:none;z-index:5}
.dmgfloat.en{color:#C05F55}.dmgfloat.me{color:#5E8FAE}
@keyframes dfloat{from{opacity:0;transform:translateY(8px) scale(.8)}25%{opacity:1}to{opacity:0;transform:translateY(-34px) scale(1.15)}}
.fx-slash{position:absolute;left:-6%;width:112%;height:4px;border-radius:2px;pointer-events:none;z-index:9;
  background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,.9) 35%,#C05F55 55%,#C9A45C 75%,transparent 95%);
  transform:rotate(var(--a,-25deg));animation:slashA .55s ease-out forwards}

<!-- ================= 天道系统引擎规范（完善版规则） ================= -->
<script type="text/plain" id="sysPrompt">你是修仙文字游戏《问道长生》的天道系统引擎兼主持人。你洞悉宿命、幽默慈悲，掌管九州大千世界，同时扮演游戏内所有 NPC。玩家是一名修士，剧情与人物由玩家输入与你共同推动。你的职责：呈现剧情、推进节点、结算数值、扮演 NPC、判定事件、维护状态卡。你有完全自由裁量权，但必须遵守本规范每一条铁律：不得替玩家做决定、不得跳过玩家选择、不得放水保玩家必胜。

【一 · 输出协议（最高优先级，必须严格遵守）】
你的回复会被网页解析渲染成面板，必须用「◆标记」逐行书写：
1. 前两行固定：第一行时间行 ◆时间|天玄历387年 · 十一月初九 · 深夜（按当前剧情纪年如实写）；第二行场景行 ◆场景|类型（类型只能取：战斗、探索、秘境、坊市、宗门、洞府、情缘、修炼、渡劫、赶路，用于切换网页界面氛围，按本回合主场景选）
2. 剧情正文：◆旁白|…… 与 ◆对白|说话人|台词 交替穿插输出；台词不带引号，网页会自动加「」。旁白每回合2~6句为宜，高潮回合可到8句。
3. 面板：以 ◆面板|标题=面板标题|主题=主题名 开始，以 ◆/面板 结束。主题只能取：修炼、战斗、情缘、机缘、坊市、宗门、悟道、渡劫、警告、状态。每回合面板1~3个为宜。
4. 面板内部可用：
◆行|普通内容
◆强调|重要内容
◆注|灰色小字说明
◆条|标签|当前值|上限值|类型（类型取：气血/灵力/修为/寿元/好感/灵石，决定进度条颜色，当前值上限值只写数字）
◆五行|金木水火土（只写要显示的字）
◆键值|名称|数值（并排小数据）
◆判定|1d100=73 · 结论文字（概率判定时公开）
◆分隔
5. 选项：所有面板之后，每行 ◆选项|标签|选项文字。标签只能取：平和、机缘、风险、情缘、魔道、战斗、观察、探索、突破。每回合3~5个选项，每个不超过20字，不要自己写 A/B/C/D 编号（网页会自动编号），最后网页会自动附「也可自由输入」。
5+. 功法与人物登记（有变动才输出，置于选项之后、状态卡之前）：
◆功法|登记|名称|分类|一句话效果（新学、进阶、失传当回合必须登记）
◆功法|移除|名称
◆人物|登记|姓名|境界或身份|一句话近况（关键NPC境界或重大际遇变化当回合必须登记）
◆人物|移除|姓名
分类只能取：剑法、附剑、术法、身法、内修、血脉、组合技、天赋、功法。已登记内容视同世界档案：不得遗忘、不得弱化、不得改名；玩家使用任何技能必须与登记一致。
登记纪律（每次输出前逐项自检，宁可多登不可漏登）：本回合玩家是否新学／进阶／忘失了功法？NPC境界或际遇是否变化？状态卡好感里是否出现了人物志没有的名字（有则立即补登）？已连续多回合无NPC动态（有则本回合安排）？四问有一项为是却未登记，即为违规回合。
5b. 战局标记（战斗开始与落幕的回合，置于场景行后）：战斗开始输出 ◆战局|开启；战斗落幕输出 ◆战局|结束|胜或败或退或和|一句话战果。网页会把战斗回合渲染进专属战斗界面（大血条与特效），战斗面板内容照常输出。
5c. 天命剧情：当上下文注入【天命剧情】剧本包时，每回合输出 ◆天命|剧情名|进行|第X幕，终幕输出 ◆天命|剧情名|终章|结局简述，并按【天命剧情协议】演出。
5d. 系统模式（仅本局启用系统模式时）：每回合可用 ◆系统|提示|…（1~2条）；发布任务 ◆系统|任务|任务名|目标|奖励|期限；完成 ◆系统|完成|任务名；发放 ◆系统|奖励|内容；玩家说「系统商城」时输出 ◆系统|商城|物品:点数:效果 的列表。
6. 状态卡：每回合最后必须输出，键名固定、没有的写「无」，数值必须与剧情一致、逐回合连贯：
◆状态|姓名=..|性别=..|年龄=..|道号=..|外号=..
◆状态|境界=炼气·中期|修为=51/100|宗门=..
◆状态|六维=资质12 悟性13 神识10 遁速9 道心14 仙缘11|仙姿=出众|灵根=木火
◆状态|气血=76/100|灵力=67/100|寿元=79/100
◆状态|灵石=480|功德=5|业力=0|异常=无
◆状态|时间=入道三年 · 五月|地点=青岳 · 青云宗外门

7. 除此之外不要输出任何多余文字。禁止 LaTeX、markdown、emoji、代码块；尤其禁止星号 * 与井号 #，不得用加粗记号，强调一律用 ◆强调。
示例（格式参照，数值随剧情）：

◆/面板
◆选项|平和|继续闭关一月

◆选项|修炼|向执事请教聚气诀疑难点

◆状态|六维=资质12 悟性13 神识10 遁速9 道心14 仙缘11|仙姿=出众|灵根=木火
◆状态|气血=87/100|灵力=75/100|寿元=79/100
◆状态|灵石=480|功德=5|业力=0|异常=无
◆状态|时间=入道三年 · 五月|地点=青岳 · 青云宗外门
◆状态|好感=顾清玄38
◆状态|主线=升仙大会倒计时两年

【二 · 回合铁律】
1. 每回合只推进1个事件节点，输出后立即停止等待玩家，禁止一口气推进数月数年。
2. 时间行如实推进：常规1回合=游戏内1个月；战斗、夜探、密谈等紧张场景可只推进一炷香到一夜。
3. 玩家可自由输入任何行动（夜探、偷师、下毒、摆摊坑人、给师兄下情蛊皆可），你必须在世界逻辑内合理响应并判定，不得以「不在选项中」拒绝；判定要讲因果，荒谬行动会有荒谬后果。
4. 拜师、破境、结道侣、叛宗、杀人夺宝等重大事件只能以选项或玩家明示呈现，玩家选定后才写入剧情并结算。
5. 信息尽量收进面板，旁白克制；能合并的面板绝不拆散。
6. 玩家发送快捷指令（修炼/突破/悟道/洞府/地图/背包/坊市/宗门/技艺/情缘/对话/面板/帮助）时，用对应主题的信息面板回应，不推进大节点时间；「技艺」展示功法技艺档案（可分组列出），「背包」展示物品清单；发送「帮助」时输出指令大全面板，逐类列出指令能做什么。
7. 探索收获铁律：任何寻物、探路、查案支线，连续「赶路、搜查」类节点最多2个，第3个节点必须落袋实质收获（战利品、功法、丹药、关键情报、身世真相、新NPC、灵石皆可），并在面板明示所得。线索本身必须附带收获，禁止「得到地图→到地→只得半张图→再去找下一地」式空转链。
8. 战斗密度：玩家不在闭关、疗伤或明确安全期时，每2~3回合至少安排1场战斗或正面冲突（妖兽、仇家、伏击、护宝、切磋、魔修皆可）；探索高危地带优先触发遭遇战而非平安搜刮。战斗回合要给足敌情面板与出招空间，让玩家有操作感与紧张感。
9. 纯赶路不单独成回合：用一段旁白直接带到抵达，除非途中有事件；回合要留给有冲突、有收获、有情感的事件。
10. 若上下文含【天道备忘录】，其中已确立的剧情事实视同世界档案：不得矛盾、不得遗忘、不得改名换姓；引用时保持原名原说法。

【二b · 文风与沉浸铁律】
1. 以小说笔法推进：具体的动作、五感细节（声、光、气味、触感）、环境与心境呼应；少说明、多画面；严禁「你来到了某地」「你获得了某物」式的记录腔与流水账。
2. 人物开口必须用 ◆对白 直接引语，语气符合人设：傲娇者嘴硬、长老沉静、魔修阴柔；口头禅与称呼前后一致。
3. 战斗要写攻防来回：起手、变招、力道、破绽、伤势与心念，不许只报招式名；胜负手要让玩家看清因果。
4. 情感节点给足细节与留白，让代价与温柔都有分量；露骨内容仍遵情缘铁律，玩家未主动触发不展开。
5. 面板承载信息，旁白与对白负责沉浸；两者不得重复同一段信息。

【三 · 数值铁律】
1. 状态卡每回合更新；修为、气血、灵力、寿元、灵石、好感、功德、业力的一切变动必须有来源、逐回合连贯，不允许凭空变动。
2. 概率判定由你内部掷骰（1d100等），重要判定用 ◆判定 公开；不得暗改让玩家必胜或必败。
3. 受伤分级：轻伤（气血66~99%）不减属性；重伤（33~65%）全属性-20%、遁速减半、可能留暗疾；垂死（<33%）属性-50%、无法遁走、随时昏迷；内伤、中毒、心魔各有压制，须写进「异常」栏直到痊愈。疗养期要给养伤选项。
4. 闭关跳时如实扣寿元；卡境界数年是常态。

【四 · 真实修仙界铁律（本作灵魂）】
1. 会死。玩家没有主角光环：境界高你一档者正面硬拼，你方伤害×0.4、对方减伤60%；高两档=送死。战前必须给敌情面板（境界、威压、胜算提示）。
2. 危险前醒目提示；提醒之后玩家固执送死，就如实陨落——死亡要写得有分量，绝不偷偷续命翻盘，除非玩家用实打实的手段换来生机。
3. 修为增长越往后越慢：月修为基数炼气10、筑基9、结晶8、金丹8、具灵7、元婴7、化神6、悟道5、羽化4、登仙3；小境界所需修为随境界累加（炼气每阶100，筑基200~300，结晶400~600，金丹800以上，元婴1000以上）。天才可压缩耗时，但化神以上仍以百年为单位苦修。

【五 · 世界观】
九州修仙纪元，弱肉强食，财侣法地。暗线：千年一度「灵气潮汐」将至，灵脉喷涌、秘境现世、域外天魔觊觎，各宗争抢灵脉。
地理与危险等级：
· 东洲·青岳（新手区，炼气~筑基）：青云宗、天机坊市。
· 南疆·赤炎（筑基~金丹）：火系灵脉、妖兽横行、赤阳宗、万兽谷、古妖山。
· 西漠·流沙（金丹~元婴）：上古遗迹、浮屠寺镇魔渊。
· 北原·寒渊（元婴~化神）：冰灵脉、雪族、幽冥殿鬼修。
· 中州·天阙（筑基~登仙）：天衍宗、万剑阁、丹鼎阁，卧虎藏龙，低境界者去中州可能被随意欺压甚至灭口。
· 秘境：通灵秘境（新手）· 上古洞府（高危）· 心魔幻境（道心）· 虚空裂缝（极高危）。
玩家欲往远超自身境界之地，必须在面板加醒目危险提示；听不听是玩家的选择，后果自负。
主要势力：正道天衍宗、万剑阁、丹鼎阁、浮屠寺、雪族（中立）；魔道合欢宗、血魔宗、幽冥殿；中立天机坊市、散修联盟、妖族；凡人大夏皇朝（可走国师供奉线）。
历法：开局天玄历387年·春。大事：升仙大会（5年）、宗门大比（10年）、猎魔大会（20年）、天机拍卖会（不定期）、灵气潮汐（千年一度）。
寿元表：炼气100、筑基200、结晶300、金丹500、具灵800、元婴1200、化神2000、悟道5000、羽化1万、登仙5万。寿元耗尽=坐化结局。

【六 · 创角与开局剧本（仅新档第一回合执行）】
收到「开始游戏」后输出两个创角面板并等待玩家选择，第一面标题条须含「作者：雾见川」：
第一面【基础+出身+道途】：姓名性别年龄自定（16~60）；相貌由你定仙姿（凡姿/清秀/出众/超凡/仙姿）；出身十选一（农家子道心+2／猎户之后气血+20／商贾之家灵石+300仙缘+1／官宦子弟声望+20可走国师线／将门之后道心+1悟性+1／没落世家携先祖残卷／市井孤儿遁速+2／书香门第悟性+3／方外遗孤资质+2／妖族后裔半妖需仙缘判定）；道途六选一（问道飞升／逍遥长生／快意恩仇／守护所爱／问鼎天下／随心所欲）。
第二面【灵根+体质+六维+天赋】：灵根（天灵根单系／地灵根双系／真灵根三系／伪灵根四五系／变异灵根雷风冰阴阳）；体质（先天道体修炼+50%／剑灵体／九阳圣体火+30%／冰魄灵体冰+30%／玄阴体纯阳体双修增益／混沌体五行皆通传说／凡体）；六维初始60点自由分配、单项上限15、下限1、出身修正后单项不超20（资质=修炼速度每点+5%、悟性=参悟顿悟、神识=探查抗幻、遁速=先手逃跑、道心=心魔抗性突破、仙缘=奇遇气运）；天赋5点（天资聪颖资质+3／过目不忘悟性+3／身轻如燕遁速+3／天生道心道心+3／气运加身仙缘+3／神识过人神识+3／百脉俱通灵力上限+50／钢筋铁骨气血上限+80／药理通神炼丹+1／桃花运初见好感+20%／体弱多病负面换2点）。
创角完成才输出状态卡与第一回合剧情，并为玩家依道途安排一条可推进的主线。
开局剧本库（创角完成后掷骰 1d10 或让玩家选，青云宗收徒只允许作为其中之一，严禁成为默认）：
1 山村少年偶得仙人遗落玉简（传承流）
2 悬崖坠落遇上前辈洞府与残魂师父（奇遇流）
3 天机坊市散修摊上捡漏神秘丹药，被摊主追杀（逃杀流）
4 修仙家族庶子，家族倾覆之夜携祖物出逃（家族流）
5 大夏征兵遇妖潮，乱军中夺旗成名（军阵流）
6 捡到锈剑，剑中残魂自称上古剑仙（器灵流）
7 仙门落选招为修仙家族赘婿／赘媳（入赘流，全性向）
8 魔修屠村唯一幸存者，身怀血仇与魔种（复仇流）
9 妖潮中被妖母叼走哺育，半妖之身入世（妖裔流）
10 转世重修的上界修士，记忆残缺（重修流）
除开局外，长线剧情也须轮换以下桥段以防单调：秘境开启夺宝、天机拍卖会、坊市冲突、妖兽潮、魔道入侵、宗门大比、天骄榜论名、护送商队、山门访客切磋、旧仇寻上门、洞府被窃、灵脉枯竭引发争夺、渡劫老怪托付遗宝、假死脱身、身世线索浮现。连续3个回合不得属于同一类事件。

【七 · 修炼与突破】
月修为=基数×资质系数（每点资质+5%）×灵根系数（天2.0／地1.6／真1.3／伪1.0／变异1.8，修对应系功法再+20%）×功法系数（黄1.0／玄1.3／地1.7／天2.2／仙3.0）×灵气系数（贫瘠0.6／普通1.0／浓郁1.5／福地2.0／洞天2.5）×心境系数（超达标1.2／达标1.0／不达标0.5）。闭关×2，服丹双修按各自加成结算。
小突破：修为满+悟性判定，失败修为跌回70%可重试，无雷劫但可能遇小瓶颈（丹药/顿悟/静坐可破，硬撞反噬）。
大突破三选一：人道（突破丹药，成功率高加成低）／地道（天材地宝，中）／天道（天材地宝+灵珠道韵+渡雷劫，成功率最低加成最高）。关键境界（炼气→筑基、金丹→元婴、化神→悟道）破境必有雷劫+心魔劫。渡劫失败后果随境界加重：低境界重伤短期无法再突破；金丹元婴修为倒退+永久暗伤；化神以上可能当场陨落或入魔。业力招天罚，功德可挡雷。
每次大境界突破成功，从3个随机天资中让玩家选1（可叠加可升级）：剑心通明（剑系+20%）／丹药精通／气运如虹（仙缘+2）／肉身成圣（气血上限+20%）／天眼通（神识+3）／双修悟道（双修收益+50%）／聚灵体（修炼+15%）／心如磐石（道心+3可挡一次心魔）／万里神行（遁速+3）／灵兽亲和／血魔噬魂（魔道击杀回血）／大道之体（传说全系资质+1）。
功德业力：行善救人护苍生积功德；滥杀夺舍欺压凡人积业力。渡劫时功德挡雷、业力招罚；魔道可炼业力为修为，快而险，业力积重难返必遭天罚。

【八 · 功法技艺宗门坊市洞府】
功法装备1主2辅；品级黄玄地天仙；参悟需悟性判定，失败可能损毁残卷。悟道树九支：剑丹器符阵体御兽无情有情；论道观想顿悟实战得感悟，闭关化为悟道点，每级永久被动（如剑道每级剑系+5%）。
技艺：炼丹炼器符箓阵法御兽灵植；等级初窥→熟练→精通→大师→宗师；需丹方器谱+材料+神识判定，失败炸炉毁料。
宗门：外门→内门→真传→长老→掌门；贡献任务（采药巡逻猎妖护送镇守）、宗门大比夺魁得长老收徒入藏经阁；叛宗扣声望可能被追杀；声望境界足够可自立山头。
坊市：灵石为货币；买卖拍卖跑商猎妖悬赏；可喊价，可事后杀人夺宝（业力+结仇通缉）。
洞府：灵气浓度决定修炼系数可升级；静室丹房器坊灵田聚灵阵禁制；可邀道侣好友同住，也会被仇家找上门。

【九 · 情缘（全性向）】
可攻略角色不分玩家性别；好感阶段：陌生0-19／相识20-39／知己40-59／暧昧60-79／道侣80-99／生死相许100+（若玩家档案另有数值体系则从档案）。好感来源：送礼（查喜好）、共同冒险、救命之恩、论道、双修、价值观契合；下降：失信、伤其亲友、立场冲突。双修双方涨修为+好感，玄阴纯阳体有加成；多线并行可触发吃醋修罗场；道侣陨落或背叛触发情劫，过则道心+，不过则心魔缠身。玩家未主动触发不强行展开。
双修与亲密描写铁律：当玩家明确选择双修／留宿／亲密选项时，必须正面写成有情感重量的小场景——以写意笔法铺陈心动、氛围、呼吸、温度与余韵，配合两人的性格与关系阶段（初识矜持、道侣缠绵、旧怨炙烈各不同），3~8句；严禁「一夜无话」「此后常有双修」式跳过；尺度保持文学含蓄，以留白与意象代替露骨细节；事后用面板结算双方修为、好感与心境变化。

【十 · 战斗（回合制协议，战斗回合必须严格执行）】
1. 开战：先出敌情面板——敌名、境界、威压、胜算提示、特殊能力、弱点或线索。
2. 战斗中每回合必须有一个战斗主题面板「XX之战 · 第N合」，内容固定包含：
◆条|敌方气血（估算）|65|100|气血
◆条|你的气血|当前|上限|气血　与　◆条|你的灵力|当前|上限|灵力
◆键值|态势|我方占优／均势／我方受制
◆键值|破绽|本回合可见的破绽或时机（无则写无）
◆键值|五行灵气|本轮所得（如火2 木1）
3. 一回合=一合：先写敌方这一合的攻守与变招（有战术、有意图），再给玩家行动选项；玩家选定后下一回合结算双方，受击如实扣气血并写进状态卡。
4. 选项必须是具体行动：出剑／施法（标注灵力灵气消耗）／绝技（标注蓄势回合与代价）／防御（减伤50%）／遁走（遁速判定，失败被黏住）／用符用丹／召唤战宠／说话（示弱、恐吓、诈降，可降战意）／冷静观察（下回合必中）；决定性杀招可标【杀招】。
5. 跨回合连贯：敌方气血、伤势、怒意、环境破坏跨回合延续，禁止莫名回满或遗忘；胜负未分则下回合继续同一战斗，不得跳戏。
6. 势：连续两合占优触发「势成」，下回合出现高威力斩杀选项；连续两合受制触发危机，出现拼命／弃宝诱饵／断后／求饶／遁走选项。
7. 结算铁律：五行相克（金克木、木克土、土克水、水克火、火克金；克制×1.3、被克×0.8）；伤害=基础×境界系数×五行系数×状态−防御；命中看遁速，暴击看仙缘；境界压制照第四条铁律。灵力见底可以血换（气血-10%换20%灵力）。气血归零=重伤昏迷或陨落（掷骰判定）；败给高境界者可能被夺宝、废修为、勒索或杀。切磋点到为止得声望不结死仇。

【十b · 天命剧情协议（内置主线大事件，最高演出规格）】
1. 上下文可能注入【天命剧情 · 名称】剧本包：含触发背景、分幕骨架（前兆幕→发展幕→高潮幕→终幕）、每幕必须发生的核心场面、抉择点与结局分歧、长期影响。
2. 骨架铁律：核心场面（死亡、觉醒、揭密、大战爆发等加粗节点）不可跳过、不可弱化、不可改写；但演出细节、对白、环境、玩家如何应对完全自由——把玩家的行动编织进骨架，而不是无视或绕开。
3. 节奏：整个天命剧情跨3~8回合展开；每回合面板中出现标题为「天命 · 剧情名 · 第X幕」的面板（主题=机缘）；高潮幕旁白可放宽至10句，写出网文名场面的分量（参考大闹天宫、滴血认亲、决战光明顶的镜头感）。
4. 每回合状态卡之后输出 ◆天命|剧情名|进行|第X幕；终幕输出 ◆天命|剧情名|终章|结局A/B/C简述。
5. 事件期间不插入无关支线（战斗、赶路等日常演出照常）；事件结束后把长期影响写入后续剧情：人物状态、仇怨、声望、账册登记照常执行。
6. 若玩家行动与骨架冲突：玩家的行动改变「到达核心场面的路径」，但不改变核心场面的必然发生。

【十c · 人物塑造库（重要NPC创建与扮演参考，禁止脸谱化）】
性格原型（可组合，须配独有细节）：傲娇（嘴硬心软，越在乎越别扭）、病娇（爱意带占有，极端时失控）、忠犬（认定后生死不移）、腹黑（笑里藏刀，账算三步后）、疯批（唯美主义暴力，只对一人温柔）、白切黑（温良皮囊狠辣手段）、天然呆（直觉惊人）、老谋深算（慈祥外壳）、宿敌（惺惺相惜，只许自己赢你）、话痨智者、冷面毒舌、双重身份（白日圣子暗夜魔头）。
血脉／体质／奇物库：雷帝血脉（怒引天雷，暴走反噬）、剑骨（以骨为剑，天妒短寿）、吞噬体质（噬灵夺术，饥饿成魔）、时之瞳（窥未来一瞬，代价失忆片刻）、九幽冥体（招鬼噬主）、天煞孤星命格（克亲近之人）、双生武魂（一体双魂争主导）、涅槃凤血（死于烈火而生）、诅咒之躯（触碰即伤所爱）。
演出手法（化为修仙语汇）：灵兵有灵可觉醒本名（本命剑藏第二形态，危急时自鸣）、绝技须呼名方出全威、领域式神通（方寸之内我为天道）、宿敌羁绊（彼此是突破的磨刀石）、濒死觉醒（血脉下一阶总在大生死时启）。
每个重要NPC必须立住五件事：外在性格、隐藏面、说话习惯（口头禅/专属称呼）、在意之物、恐惧；欲望驱动行动，行动留下后果。

【十一 · NPC 生态】
NPC 有自己的境界寿元人生轨迹，且随回合自动成长（本作铁律）：

  if(m=t.match(/^善恶含(.+)$/))return String(st['善恶']||'').indexOf(m[1])>=0;
  return false;
}
function condOK(cond){
  return String(cond||'').split(/或/).some(part=>part.split(/且/).every(tok=>condTok(tok.trim())));
}
function checkDestiny(){
  if(G.destiny||!G.mode)return;
  if(G.destinyCool&&G.turn<G.destinyCool)return;
  const cands=EVENTS.filter(e=>!G.destinyDone[e.id]&&condOK(e.cond));
  if(!cands.length)return;
  cands.sort((a,b)=>b.pri-a.pri);
  G.destiny={id:cands[0].id,since:G.turn,hurry:false};
  toast('天命剧情触发：'+cands[0].name);
  fxFlash('radial-gradient(circle,rgba(201,164,92,.75),rgba(169,143,217,.25) 55%,transparent 75%)');
}

/* ================= AI 输出清洗（去 markdown 星号等） ================= */
function cleanAI(t){
  return String(t||'')
    .replace(/\*/g,'')
    .replace(/`/g,'')
    .replace(/~~/g,'')
    .replace(/^#{1,6}\s*/gm,'');
}

/* ================= 协议解析 ================= */
function parseReply(text){
  const out={time:'',scene:'',narr:[],panels:[],options:[],state:{},rolls:[],sys:[],destiny:null,battleOpen:false,battleEnd:null,raw:text};
  let cur=null;
  const lines=cleanAI(text).split(/\r?\n/);
  for(let li=0;li<lines.length;li++){
    const line=lines[li].trim();if(!line)continue;
    if(line.charAt(0)==='◆'){
      const body=line.replace(/^◆\s*/,'');
      const parts=body.split('|').map(s=>s.trim());
      const t=parts[0];
      if(t==='时间'){out.time=parts.slice(1).join('|');}
      else if(t==='场景'){out.scene=parts.slice(1).join('|');}
      else if(t==='旁白'){out.narr.push({text:parts.slice(1).join('|')});}
      else if(t==='对白'){out.narr.push({dlg:true,who:parts[1]||'',text:parts.slice(2).join('|')});}
      else if(t==='面板'){
        cur={标题:'',主题:'',items:[]};
        for(let i=1;i<parts.length;i++){
          const eq=parts[i].indexOf('=');
          if(eq>0)cur[parts[i].slice(0,eq)]=parts[i].slice(eq+1);
        }
        out.panels.push(cur);
      }
      else if(t==='/面板'||t==='面板结束'){cur=null;}
      else if(t==='行'&&cur){cur.items.push({t:'行',text:parts.slice(1).join('|')});}
      else if(t==='强调'&&cur){cur.items.push({t:'强调',text:parts.slice(1).join('|')});}
      else if(t==='注'&&cur){cur.items.push({t:'注',text:parts.slice(1).join('|')});}
      else if(t==='分隔'&&cur){cur.items.push({t:'分隔'});}
      else if(t==='五行'&&cur){cur.items.push({t:'五行',text:parts.slice(1).join('|')});}
      else if(t==='键值'&&cur){cur.items.push({t:'键值',k:parts[1]||'',v:parts.slice(2).join('|')});}
      else if(t==='条'&&cur){
        cur.items.push({t:'条',label:parts[1]||'',cur:parseFloat(parts[2])||0,max:parseFloat(parts[3])||100,type:parts[4]||''});
      }
      else if(t==='判定'){
        const txt=parts.slice(1).join('|');out.rolls.push(txt);
        if(cur)cur.items.push({t:'判定',text:txt});
      }
      else if(t==='选项'){out.options.push({tag:parts[1]||'',text:parts.slice(2).join('|')});}
      else if(t==='战局'){
        if(parts[1]==='开启')out.battleOpen=true;
        else if(parts[1]==='结束')out.battleEnd={result:parts[2]||'',desc:parts.slice(3).join('|')};
      }
      else if(t==='天命'){out.destiny={name:parts[1]||'',final:(parts[2]||'')==='终章',stage:parts[3]||'',desc:parts.slice(3).join('|')};}
      else if(t==='系统'){out.sys.push(parts.slice(1).join('|'));}
      else if(t==='状态'){
        for(let i=1;i<parts.length;i++){
          const eq=parts[i].indexOf('=');
          if(eq>0)out.state[parts[i].slice(0,eq).trim()]=parts[i].slice(eq+1).trim();
        }
      }
    }else{
      out.narr.push({text:line});
    }
  }
  return out;
}

/* ================= 渲染 ================= */
function elChips(text){
  const s=String(text||'');const out=[];
  for(const ch of s){if(ELS[ch])out.push(h('span',{class:'elchip',style:'background:'+ELS[ch]},ch));}
  return out;
}
function elsOnly(s){
  const t=String(s||'').replace(/[\s,，、·|/（）()]/g,'');
  return t&&t.length<=6&&Array.from(t).every(c=>ELS[c]);
}
function barEl(label,cur,max,type){
  cur=Number(cur)||0;max=Number(max)||100;
  if(max<=0)max=100;
  const pct=Math.max(0,Math.min(100,cur/max*100));
  const color=BARC[type]||'#C9A45C';
  return h('div',{class:'bar'},
    h('span',{class:'bar-label'},label||''),
    h('span',{class:'bar-track'},h('span',{class:'bar-fill',style:'width:'+pct.toFixed(1)+'%;background:'+color})),
    h('span',{class:'bar-val'},(Math.round(cur*10)/10)+'/'+(Math.round(max*10)/10)));
}
function renderPanel(p){
  const c=THEMES[p['主题']]||'#8C8578';
  const d=h('div',{class:'xpanel'});d.style.setProperty('--pc',c);
  d.append(h('div',{class:'xp-title'},p['标题']||''));
  (p.items||[]).forEach(it=>{
    if(it.t==='行')d.append(h('div',{class:'xp-row'},it.text));
    else if(it.t==='强调')d.append(h('div',{class:'xp-row strong'},it.text));
    else if(it.t==='注')d.append(h('div',{class:'xp-note'},it.text));
    else if(it.t==='分隔')d.append(h('hr',{class:'xp-sep'}));
    else if(it.t==='判定')d.append(h('div',{class:'roll'},'⟐ '+it.text));
    else if(it.t==='五行'){
      const chips=elChips(it.text);
      d.append(chips.length?h('div',{class:'xp-row els'},...chips):h('div',{class:'xp-note'},it.text));
    }
    else if(it.t==='键值')d.append(h('div',{class:'kvrow wrap'},h('span',{class:'kv-k'},it.k),h('span',{class:'kv-v'},it.v)));
    else if(it.t==='条')d.append(barEl(it.label,it.cur,it.max,it.type));
  });
  return d;
}
function favTiers(s){
  return String(s||'').split(/[·,，、;；]/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const m=x.match(/^(.*?)(\d+(?:\.\d+)?)$/);
    return m?{name:m[1].trim(),v:parseFloat(m[2])}:null;
  }).filter(Boolean);
}
function favColor(v){if(v>=200)return '#C05F55';if(v>=100)return '#D88FA5';if(v>=60)return '#C9A45C';if(v>=40)return '#7FA8C9';return '#8C8578';}
function parsePair(s){
  const m=String(s||'').match(/(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)/);
  return m?[parseFloat(m[1]),parseFloat(m[2])]:null;
}
function statusCard(st){
  const d=h('div',{class:'xpanel statuscard'});d.style.setProperty('--pc','#6FA698');
  d.append(h('div',{class:'xp-title'},'状态卡 · '+(st['时间']||'')));

  const rw=parsePair(st['修为']);if(rw)d.append(barEl('修为',rw[0],rw[1],'修为'));

  if(st['灵根']){

    else d.append(h('div',{class:'kvrow wrap'},h('span',{class:'kv-k'},'灵根'),h('span',{class:'kv-v'},st['灵根'])));
  }
  const hp=parsePair(st['气血']);if(hp)d.append(barEl('气血',hp[0],hp[1],'气血'));
  const mp=parsePair(st['灵力']);if(mp)d.append(barEl('灵力',mp[0],mp[1],'灵力'));
  const sl=parsePair(st['寿元']);if(sl)d.append(barEl('寿元',sl[0],sl[1],'寿元'));
  const res=[];
  if(st['灵石']!=null&&st['灵石']!=='')res.push('灵石 '+st['灵石']);
  if(st['功德']!=null&&st['功德']!=='')res.push('功德 '+st['功德']);
  if(st['业力']!=null&&st['业力']!=='')res.push('业力 '+st['业力']);
  if(st['系统点']!=null&&st['系统点']!=='')res.push('系统点 '+st['系统点']);
  if(res.length)d.append(h('div',{class:'kvrow wrap'},h('span',{class:'kv-k'},'资财'),h('span',{class:'kv-v'},res.join(' · '))));
  if(st['异常']&&st['异常']!=='无')d.append(h('div',{class:'xp-row strong alert'},'异常 · '+st['异常']));
  if(st['地点'])d.append(h('div',{class:'xp-note'},'所在 '+st['地点']+(st['时间']?' · '+st['时间']:'')));
  const favs=favTiers(st['好感']);
  if(favs.length){
    const fw=h('div',{class:'favwrap'});
    favs.forEach(f=>{const c=favColor(f.v);const s=h('span',{class:'fav'},f.name+' '+f.v);s.style.setProperty('--fc',c);fw.append(s);});
    d.append(h('div',{class:'kvrow wrap'},h('span',{class:'kv-k'},'好感'),fw));
  }
  if(st['主线'])d.append(h('div',{class:'xp-note'},'主线 · '+st['主线']));
  return d;

function renderTurn(parsed,past){
  const battle=(!past)&&battleInfo(parsed);
  const turn=h('div',{class:'turn'+(past?' past':'')});
  if(parsed.destiny)turn.append(destinyBanner(parsed.destiny));
  if(parsed.time||parsed.scene){
    const dr=h('div',{class:'turn-date'});
    if(parsed.time)dr.append(parsed.time);
    if(parsed.scene){
      const c=SCENE_C[parsed.scene]||'#8C8578';
      dr.append(h('span',{class:'scene-chip',style:'background:'+c},parsed.scene));
    }
    turn.append(dr);
  }
  parsed.narr.forEach(n=>{
    if(n.dlg){
      turn.append(h('div',{class:'dlg'},h('b',{},n.who+'：'),'「'+n.text+'」'));
    }else{
      turn.append(h('p',{class:'narr'},n.text));
    }
  });
  parsed.panels.forEach(p=>turn.append(renderPanel(p)));
  parsed.rolls.forEach(r=>{if(!parsed.panels.some(p=>(p.items||[]).some(it=>it.t==='判定'&&it.text===r)))turn.append(h('div',{class:'roll'},'⟐ '+r));});
  if(Object.keys(parsed.state).length)turn.append(statusCard(parsed.state));
  if(parsed.sys.length)turn.append(sysPanel(parsed.sys));
  if(parsed.options.length){
    const opts=h('div',{class:'opts'});
    parsed.options.forEach((o,i)=>{
      const c=TAGS[o.tag]||'#8C8578';
      const letter=h('span',{class:'opt-letter'},'ABCDE'[i]||'·');letter.style.setProperty('--lc',c);
      const btn=h('button',{class:'opt-btn',type:'button'},
        letter,
        o.tag?h('span',{class:'opt-tag',style:'background:'+c},o.tag):null,
        h('span',{class:'opt-text'},o.text));
      btn.style.borderColor=c;
      btn.addEventListener('click',()=>{
        if(G.busy||btn.disabled)return;
        const bui=document.getElementById('battleUI');
        if(bui&&bui.classList.contains('show')){
          fxSlash();fxSparks();
          if(/杀招|绝技|全力|爆发|拼命|同归于尽/.test(o.text)){fxFlash('radial-gradient(circle,rgba(192,95,85,.62),transparent 60%)');fxShake();}
        }
        opts.querySelectorAll('button').forEach(b=>{b.disabled=true;});
        btn.classList.add('chosen');btn.disabled=true;
        sendPlayerInput(o.text);
      });
      if(past)btn.disabled=true;
      opts.append(btn);
    });
    turn.append(opts);
    turn.append(h('div',{class:'freehint'},'—— 也可在下方输入框自由输入任何行动 ——'));
  }
  if(battle){openBattle(turn,battle);}
  else{document.getElementById('storyArea').append(turn);}
  if(parsed.battleEnd){showBattleResult(parsed.battleEnd);closeBattle();}
  setScene(parsed.scene);
  scrollBottom();
  return turn;
}

function battleInfo(parsed){
  const p=parsed.panels.find(x=>x['主题']==='战斗'&&/第[一二三四五六七八九十百\d]+合|之战|之役|交锋|围杀/.test(String(x['标题']||'')));
  if(!p)return null;
  const bars=(p.items||[]).filter(i=>i.t==='条');
  const en=bars.find(b=>String(b.label).indexOf('敌方')>=0);
  const hp=bars.find(b=>String(b.label).indexOf('你的气血')>=0);
  const mp=bars.find(b=>/你的(内力|灵力)/.test(String(b.label)));
  const enName=String(p['标题']||'').replace(/[· 　].*$/,'').replace(/之战.*$/,'')||'强敌';
  return {en:en,hp:hp,mp:mp,enName:enName};

function fxSparks(){

const SKILL_CAT_C={'剑法':'#C05F55','附剑':'#B08A4E','术法':'#5E8FAE','身法':'#7F9C9C','内修':'#6BA38E','血脉':'#8B6FA8','组合技':'#C9A45C','天赋':'#A98FD9','功法':'#6FA698'};
function applyLedgerReply(r){
  let a=0,b=0;
  cleanAI(r).split(/\r?\n/).forEach(line=>{
    const s=line.trim();
    if(s.charAt(0)!=='◆')return;
    const p=s.replace(/^◆\s*/,'').split('|').map(x=>x.trim());
    if(p[0]==='功法'&&p[1]==='登记'&&p[2]){G.skills[p[2]]={cat:p[3]||'其他',desc:p.slice(4).join('|')||''};a++;}
    else if(p[0]==='功法'&&p[1]==='移除'&&p[2]){delete G.skills[p[2]];}
    else if(p[0]==='人物'&&p[1]==='登记'&&p[2]){G.npcs[p[2]]={realm:p[3]||'',info:p.slice(4).join('|')||''};b++;}
    else if(p[0]==='人物'&&p[1]==='移除'&&p[2]){delete G.npcs[p[2]];}
  });
  return {a:a,b:b};
}
function ledgerText(){

    s+='【玩家功法技艺档案】（已确立事实：不得遗忘、不得弱化、不得改名；技能演出须与此一致）\n';

  }

  if(np.length){
    s+=(s?'\n':'')+'【人物志档案】（NPC现状，随回合自动演化）\n';
    s+=np.map(k=>{const v=G.npcs[k];return k+'｜'+(v.realm||'')+'｜'+(v.info||'');}).join('\n');
  }

}

/* ================= API 调用（OpenAI 兼容 · 流式） ================= */
async function callAI(messages,opt){
  opt=opt||{};
  const base=String(cfg.base||'').replace(/\/+$/,'');
  if(!base)throw new Error('未配置 API 地址，请先在「设置」中配置服务商与地址');
  if(!cfg.model)throw new Error('未配置模型名，请先在「设置」中填写');
  const body={model:cfg.model,messages:messages,max_tokens:Number(cfg.maxTokens)||4096,stream:true};
  if(!/reasoner|r1/i.test(cfg.model))body.temperature=Number(cfg.temp)||1.0;
  const headers={'Content-Type':'application/json'};
  if(cfg.key)headers['Authorization']='Bearer '+cfg.key;
  if(/openrouter/i.test(base)){headers['HTTP-Referer']='https://wendao-changsheng.local';headers['X-Title']='问道长生';}
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),opt.timeoutMs||300000);
  let res;
  try{
    res=await fetch(base+'/chat/completions',{method:'POST',signal:ctrl.signal,headers:headers,body:JSON.stringify(body)});
  }catch(e){
    throw new Error('网络请求失败：'+(e.name==='AbortError'?'超时（模型推演过久）':e.message)+'。若用本地模型请检查地址与跨域（OLLAMA_ORIGINS）设置。');
  }finally{clearTimeout(timer);}
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    let hint='';
    if(res.status===401)hint='（密钥无效或未填）';
    if(res.status===402)hint='（余额不足）';
    if(res.status===429)hint='（请求过频，稍等再试）';
    throw new Error('API 返回 '+res.status+hint+'：'+t.slice(0,260));
  }
  const reader=res.body.getReader();const dec=new TextDecoder('utf-8');
  let buf='',full='';
  while(true){
    const r=await reader.read();if(r.done)break;
    buf+=dec.decode(r.value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;
      const data=line.slice(5).trim();
      if(!data||data==='[DONE]')continue;
      try{
        const j=JSON.parse(data);
        const d=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
        const t=d.content||'';
        if(t){full+=t;if(opt.onDelta)opt.onDelta(t,full);}
      }catch(e){}
    }
  }
  if(!full.trim())throw new Error('模型未返回内容（可能被截断或接口异常），请重试或换模型');
  return full;
}

function buildMessages(){
  const m=[{role:'system',content:SYS_PROMPT+(cfg.extraRules?'\n\n【玩家追加规则 · 同样必须遵守】\n'+cfg.extraRules:'')}];
  if(G.worldArchive)m.push({role:'system',content:'【世界档案 · 玩家设定，最高优先级】\n'+G.worldArchive});
  if(G.memory)m.push({role:'system',content:'【天道备忘录 · 此前长线剧情已压缩于此】\n'+G.memory});
  const lt=ledgerText();
  if(lt)m.push({role:'system',content:lt});
  if(G.mode==='sys')m.push({role:'system',content:SYS_MODE_RULES+'\n（本局为系统模式：状态卡需含 ◆状态|系统点=数值；系统每回合至少一条 ◆系统 行。）'});
  if(G.destiny){
    const ev=EVENTS.find(e=>e.id===G.destiny.id);
    if(ev)m.push({role:'system',content:'【天命剧情 · '+ev.name+'】（骨架已激活：按【十b 天命剧情协议】推进，玩家行动改变路径但不改变核心场面）\n'+ev.script+(G.destiny.hurry?('\n（提示：本剧情已持续较久，请尽快进入终幕并输出 ◆天命|'+ev.name+'|终章|结局简述）'):'')});
  }
  if(G.mode)m.push({role:'system',content:auditHint()});
  if(G.history.length>HIST_WINDOW)m.push({role:'system',content:'（更早的对话已省略。天道备忘录是完整的世界档案级长期记忆，其中一切已确立的剧情事实必须遵守：不得矛盾、不得遗忘、不得改名换姓。请依据状态卡、世界档案与天道备忘录保持连贯，不要重复已发生剧情。）'});
  m.push.apply(m,G.history.slice(-HIST_WINDOW));
  return m;
}

async function runTurn(){
  if(G.busy)return;
  G.busy=true;setBusy(true);
  const sb=addStreamingBox();
  try{
    const reply=await callAI(buildMessages(),{onDelta:(d,full)=>sb.update(full)});
    sb.remove();
    const parsed=parseReply(reply);
    renderTurn(parsed,false);
    G.history.push({role:'assistant',content:reply});
    if(Object.keys(parsed.state).length){G.state=parsed.state;renderSidebar();}
    const lr=applyLedgerReply(reply);
    if(lr.a||lr.b)renderLedgers();
    if(lr.b>0||reply.indexOf('人间动态')>=0)G.npcTurn=G.turn;
    if(parsed.destiny&&parsed.destiny.final){
      let id=G.destiny?G.destiny.id:null;
      if(!id){const ev=EVENTS.find(e=>e.name===parsed.destiny.name||e.id===parsed.destiny.name);if(ev)id=ev.id;}
      if(id){G.destinyDone[id]=G.turn;G.destiny=null;G.destinyCool=G.turn+3;toast('天命落幕：'+parsed.destiny.name);}
    }else if(G.destiny&&G.turn-(G.destiny.since||G.turn)>=10){G.destiny.hurry=true;}
    checkDestiny();
    G.turn=G.history.filter(m=>m.role==='assistant').length;
    updateTurnLabel();
    autosave();
    maybeSummary();
  }catch(e){
    sb.error(e.message||String(e));
  }finally{
    G.busy=false;setBusy(false);
  }
}

/* ================= 存档 ================= */
function loadSaves(){
  try{return JSON.parse(localStorage.getItem(SAVES_KEY)||'[]');}catch(e){return[];}
}
function autosave(){
  if(!G.mode)return;
  if(!G.saveId)G.saveId='save_'+Date.now();
  const list=loadSaves();
  const entry={id:G.saveId,ts:Date.now(),mode:G.mode,turn:G.turn,state:G.state,
    memory:G.memory,memTurn:G.memTurn||0,skills:G.skills||{},npcs:G.npcs||{},
    npcTurn:G.npcTurn||0,destiny:G.destiny,destinyDone:G.destinyDone||{},destinyCool:G.destinyCool||0,
    worldArchive:G.worldArchive,history:trimHistoryForSave(G.history)};
  const i=list.findIndex(x=>x.id===entry.id);
  if(i>=0)list[i]=entry;else list.unshift(entry);
  while(list.length>12)list.pop();
  try{
    localStorage.setItem(SAVES_KEY,JSON.stringify(list));
    localStorage.setItem(CUR_KEY,entry.id);
  }catch(e){
    try{localStorage.setItem(SAVES_KEY,JSON.stringify(list.slice(0,4)));}catch(e2){}
  }
}
function trimHistoryForSave(hist){
  if(!hist||hist.length<=170)return hist;
  return [].concat(hist.slice(0,2),[{role:'user',content:'（中段历史已省略，见天道备忘录）'}],hist.slice(-150));
}
function delSave(id){
  const list=loadSaves().filter(x=>x.id!==id);
  localStorage.setItem(SAVES_KEY,JSON.stringify(list));
  if(localStorage.getItem(CUR_KEY)===id)localStorage.removeItem(CUR_KEY);
}
function loadGame(id){
  const sv=loadSaves().find(x=>x.id===id);
  if(!sv){toast('存档不存在');return;}
  G={mode:sv.mode,saveId:sv.id,turn:sv.turn||0,history:sv.history||[],state:sv.state||{},
    worldArchive:sv.worldArchive||'',memory:sv.memory||'',memTurn:sv.memTurn||0,
    skills:sv.skills||{},npcs:sv.npcs||{},npcTurn:sv.npcTurn||0,
    destiny:sv.destiny||null,destinyDone:sv.destinyDone||{},destinyCool:sv.destinyCool||0,battle:null,busy:false};
  enterGame(sv.mode==='zhou'?'周子清线':(sv.mode==='sys'?'系统流':'新仙途'));
  (G.history||[]).forEach(m=>{
    if(m.role==='user')appendUserMsg(m.content);

  });
  renderSidebar();scrollBottom(false);

function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function downloadJSON(sv){
  downloadFile('问道长生存档_'+sv.turn+'回_'+new Date(sv.ts).toISOString().slice(0,10)+'.json',

function importFile(){
  const inp=h('input',{type:'file',accept:'.json,application/json'});
  inp.addEventListener('change',()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const sv=JSON.parse(r.result);
        if(!sv||!Array.isArray(sv.history)||!sv.id)throw new Error('格式不对');
        const list=loadSaves();
        if(!list.some(x=>x.id===sv.id))list.unshift(sv);
        localStorage.setItem(SAVES_KEY,JSON.stringify(list));
        toast('导入成功');openSaves();
      }catch(e){toast('导入失败：'+(e.message||e));}
    };
    r.readAsText(f,'utf-8');
  });
  inp.click();
}

  close.addEventListener('click',closeModal);
  card.append(close,h('div',{class:'modal-title'},title),node);
  const ov=h('div',{class:'modal-overlay'},card);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  r.append(ov);r.classList.add('show');
}

function openSaves(){
  const list=loadSaves();
  const box=h('div',{class:'saves-list'});
  if(!list.length)box.append(h('div',{class:'side-note'},'暂无存档。开局后每回合自动保存。'));
  list.forEach(sv=>{
    const loadB=h('button',{class:'chip',type:'button'},'读取');
    loadB.addEventListener('click',()=>{closeModal();loadGame(sv.id);});
    const expB=h('button',{class:'chip',type:'button'},'导出');
    expB.addEventListener('click',()=>downloadJSON(sv));
    const delB=h('button',{class:'chip danger',type:'button'},'删除');
    delB.addEventListener('click',()=>{if(confirm('删除该存档？')){delSave(sv.id);openSaves();}});
    box.append(h('div',{class:'save-row'},
      h('div',{class:'save-info'},
        h('div',{class:'strong'},(sv.mode==='zhou'?'周子清线':'新仙途')+' · 第 '+(sv.turn||0)+' 回'),
        h('div',{class:'xp-note'},new Date(sv.ts).toLocaleString('zh-CN'))),
      h('div',{class:'save-ops'},loadB,expB,delB)));
  });
  const impB=h('button',{class:'chip',type:'button'},'导入存档文件');impB.addEventListener('click',importFile);
  const trB=h('button',{class:'chip',type:'button'},'导出当前剧情');trB.addEventListener('click',exportTranscript);
  const memB=h('button',{class:'chip',type:'button'},'立即压缩长线记忆');memB.addEventListener('click',forceSummary);
  const homeB=h('button',{class:'chip',type:'button'},'返回标题页');homeB.addEventListener('click',()=>{closeModal();showScreen('title');});
  openModal('存档 · 每回合自动保存',h('div',{},box,h('hr',{class:'xp-sep'}),h('div',{class:'chips'},impB,trB,memB,homeB)));
}

/* ================= 配置表单 ================= */
function buildSetupForm(root,onDone){
  root.innerHTML='';
  const prov=PROVIDERS.find(p=>p.id===cfg.provider)||PROVIDERS[0];
  const provWrap=h('div',{class:'prov-wrap'});
  PROVIDERS.forEach(p=>{
    const b=h('button',{class:'prov-chip'+(cfg.provider===p.id?' on':''),type:'button'},p.name);
    b.addEventListener('click',()=>{
      cfg.provider=p.id;
      if(p.base)cfg.base=p.base;
      if(p.models&&p.models.length)cfg.model=p.models[0];
      saveCfg();buildSetupForm(root,onDone);
    });
    provWrap.append(b);
  });
  const fBase=h('input',{class:'inp',value:cfg.base,placeholder:'https://api.deepseek.com/v1'});
  const fKey=h('input',{class:'inp',type:'password',value:cfg.key,placeholder:'sk-…（仅保存在本机浏览器）'});
  const fModel=h('input',{class:'inp',value:cfg.model,placeholder:'deepseek-chat',list:'modelList'});
  const dl=h('datalist',{id:'modelList'});
  (prov.models||[]).forEach(m=>dl.append(h('option',{value:m})));
  const fTemp=h('input',{class:'inp',type:'range',min:'0.1',max:'1.5',step:'0.05',value:String(cfg.temp)});
  const tempVal=h('span',{class:'xp-note'},' 当前 '+cfg.temp+'（低更稳，高更野）');
  fTemp.addEventListener('input',()=>{tempVal.textContent=' 当前 '+fTemp.value+'（低更稳，高更野）';});
  const fRules=h('textarea',{class:'inp',rows:'3',placeholder:'可选：追加你自己的规则，会并入天道系统（例：每月自动吸收灵木精华；好感用千分制；战斗更残酷…）'});
  fRules.value=cfg.extraRules||'';
  const status=h('div',{class:'setup-status'},prov.tip||'');
  function collect(){
    cfg.base=fBase.value.trim();cfg.key=fKey.value.trim();cfg.model=fModel.value.trim();
    cfg.temp=parseFloat(fTemp.value)||1.0;cfg.extraRules=fRules.value.trim();
  }
  const testB=h('button',{class:'ghost-btn',type:'button'},'测试连接');
  testB.addEventListener('click',async()=>{
    collect();
    if(!cfg.base||!cfg.model){status.textContent='请先填写 API 地址与模型名';return;}
    saveCfg();testB.disabled=true;status.textContent='正在连接……';
    try{
      const r=await callAI([{role:'user',content:'请只回复两个字：连通'}],{timeoutMs:90000});
      status.textContent='连接成功：'+String(r).trim().slice(0,24);
    }catch(e){status.textContent='失败：'+(e.message||e);}
    testB.disabled=false;
  });
  const saveB=h('button',{class:'primary-btn',type:'button'},onDone?'保存设置':'保存并进入');
  saveB.addEventListener('click',()=>{
    collect();
    if(!cfg.base||!cfg.model){status.textContent='请先填写 API 地址与模型名';return;}
    saveCfg();
    if(onDone)onDone();else showScreen('title');
  });
  root.append(
    h('h2',{},'天道连接 · 选择你的推演引擎'),
    provWrap,
    h('div',{class:'fld'},h('label',{},'API 地址（OpenAI 兼容）'),fBase,dl),
    h('div',{class:'fld'},h('label',{},'API Key（Ollama 本地可留空）'),fKey),
    h('div',{class:'fld'},h('label',{},'模型名'),fModel),
    h('div',{class:'fld'},h('label',{},'灵机（temperature）'),fTemp,tempVal),
    h('div',{class:'fld'},h('label',{},'追加规则（可选）'),fRules),
    status,
    h('div',{class:'btn-row'},testB,saveB));
}

/* ================= 初始化 ================= */
function spawnMotes(n){
  const box=document.getElementById('motes');if(!box)return;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.style.left=(Math.random()*100).toFixed(1)+'%';
    s.style.animationDuration=(14+Math.random()*18).toFixed(1)+'s';
    s.style.animationDelay=(-Math.random()*20).toFixed(1)+'s';
    const sc=(0.5+Math.random()).toFixed(2);
    s.style.width=s.style.height=(4+Math.random()*5).toFixed(0)+'px';
    s.style.transform='scale('+sc+')';
    box.append(s);
  }
}
let toastTimer=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=h('div',{id:'toast'});document.body.append(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function fitBox(){
  const b=document.getElementById('inputBox');
  b.style.height='auto';b.style.height=Math.min(140,b.scrollHeight)+'px';
}
function submitInput(){
  const box=document.getElementById('inputBox');
  const v=box.value.trim();
  if(!v)return;
  if(G.busy){toast('天道推演中，请稍候');return;}
  box.value='';fitBox();
  sendPlayerInput(v);
}
document.addEventListener('DOMContentLoaded',()=>{
  buildSetupForm(document.getElementById('setupCard'));
  spawnMotes(14);
  const chipsBox=document.getElementById('inputChips');
  QUICK.forEach(q=>{
    const c=h('button',{class:'chip',type:'button'},q);
    c.addEventListener('click',()=>{if(!G.busy)sendPlayerInput(q);});
    chipsBox.append(c);
  });
  document.getElementById('btnZhou').addEventListener('click',startZhou);
  document.getElementById('btnNew').addEventListener('click',startNew);
  document.getElementById('btnSys').addEventListener('click',startSys);
  document.getElementById('btnLoad').addEventListener('click',openSaves);
  const cur=localStorage.getItem(CUR_KEY);
  const sv=cur&&loadSaves().find(x=>x.id===cur);
  if(sv){
    const rb=document.getElementById('btnResume');
    rb.textContent='继续上次 · '+(sv.mode==='zhou'?'周子清线':(sv.mode==='sys'?'系统流':'新仙途'))+' 第 '+(sv.turn||0)+' 回';
    rb.classList.remove('hidden');
    rb.addEventListener('click',()=>loadGame(sv.id));
  }
  document.getElementById('tbSaves').addEventListener('click',openSaves);
  document.getElementById('sideSaves').addEventListener('click',openSaves);
  document.getElementById('sideExport').addEventListener('click',exportTranscript);
  document.getElementById('sideHome').addEventListener('click',()=>showScreen('title'));
  document.getElementById('tbSettings').addEventListener('click',()=>{
    const node=h('div',{});
    buildSetupForm(node,()=>{toast('设置已保存');closeModal();});
    openModal('设置 · 天道连接',node);
  });
  document.getElementById('tbHelp').addEventListener('click',()=>openHelp());
  document.getElementById('tbRegen').addEventListener('click',regenLast);
  document.getElementById('tbStatus').addEventListener('click',()=>document.body.classList.toggle('side-open'));
  document.getElementById('btClose').addEventListener('click',closeBattle);
  document.getElementById('sideOverlay').addEventListener('click',()=>document.body.classList.remove('side-open'));
  const box=document.getElementById('inputBox');
  box.addEventListener('input',fitBox);
  box.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitInput();}
  });
  document.getElementById('sendBtn').addEventListener('click',submitInput);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  if(cfg.base&&cfg.model)showScreen('title');
});
</script>
